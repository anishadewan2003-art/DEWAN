<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlowCart | Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <header>
    <div class="container nav">
      <a class="logo" href="index.html">GlowCart</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="quiz.html">Skin Quiz</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a href="tryon.html">Virtual Try-On</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <button class="btn btn-outline" data-nav="cart.html">Back to cart</button>
        <a class="cart-indicator" href="cart.html">🛒<span data-cart-count>0</span></a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <p class="tag">Secure checkout</p>
      <h1>Billing & shipping</h1>
      <div class="two-column">
        <div class="card">
          <form id="checkoutForm">
            <label>
              Full name
              <input type="text" name="name" required placeholder="Glow Lover">
            </label>
            <label>
              Email
              <input type="email" name="email" required placeholder="you@email.com">
            </label>
            <label>
              Address
              <input type="text" name="address" required placeholder="123 Glow Street">
            </label>
            <label>
              City
              <input type="text" name="city" required>
            </label>
            <label>
              State / Province
              <input type="text" name="state" required>
            </label>
            <label>
              Postal code
              <input type="text" name="zip" required>
            </label>
            <label>
              Payment method
              <select name="payment" required>
                <option value="">Select</option>
                <option>Credit Card</option>
                <option>Debit Card</option>
                <option>PayPal</option>
              </select>
            </label>
            <button class="btn btn-primary" type="submit">Place order</button>
          </form>
        </div>
        <div class="summary-card">
          <h3>Your order</h3>
          <div id="checkoutSummary" class="order-summary"></div>
          <p class="tag">Total updates with cart</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>GlowCart • Beauty & Skincare Commerce</p>
    <div class="footer-links">
      <a href="products.html">Shop</a>
      <a href="quiz.html">Quiz</a>
      <a href="blog.html">Guides</a>
      <a href="cart.html">Cart</a>
    </div>
    <p>© 2025 GlowCart. For educational use.</p>
  </footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/checkout.js"></script>
</body>

</html>
